# Seven-day soak broker settings, installed as /etc/mosquitto/conf.d/spoolpi-soak.conf.
listener 1883 127.0.0.1
allow_anonymous true
# After an outage SpoolPi ships its backlog faster than the receiver acks. The
# default limits would make the broker drop queued QoS 1 messages for the
# receiver (max_queued_messages 1000), which would look like SpoolPi losing data.
max_queued_messages 0
max_queued_bytes 0
# Room for the receiver's batches of 500 unacked messages (its ReceiveMaximum).
max_inflight_messages 500
# Persist sessions and queued messages often, not only at shutdown: a real power cut
# during the week shouldn't cost the broker's queue.
autosave_interval 10
