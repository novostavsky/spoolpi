# Every job calls one stage of ci/run.sh; the workflow only prepares the machine.
# See docs/ci.md.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bash ci/run.sh lint

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto postgresql
          # Ubuntu 24.04 blocks the unprivileged user namespaces the time-namespace test needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash ci/run.sh test ${{ matrix.python }}

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: bash ci/run.sh package

  crash:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto postgresql
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash ci/run.sh crash
