[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spoolpi"
dynamic = ["version"]
description = "Crash-safe store-and-forward buffering for edge sensor data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "novostavsky", email = "novostavsky@gmail.com" }]
requires-python = ">=3.11"
dependencies = []  # the core is stdlib-only, and this stays empty
keywords = ["iot", "edge", "sensor", "store-and-forward", "buffer", "sqlite", "mqtt", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
http = ["httpx>=0.27"]
# psycopg-binary only has wheels for these machines; elsewhere (32-bit ARM, i.e. armv7l on
# 32-bit Raspberry Pi OS) plain psycopg is used, which needs the system libpq (libpq5).
consumer = [
    "paho-mqtt>=2.0",
    "psycopg[binary]>=3.1; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 'ppc64le' or platform_machine == 'riscv64'",
    "psycopg>=3.1; platform_machine != 'x86_64' and platform_machine != 'AMD64' and platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'ppc64le' and platform_machine != 'riscv64'",
]
# What running the test suite needs; pure Python or widely built, so it installs on a
# 32-bit Pi too (bench/pi/deploy.sh uses it).
test = [
    "pytest",
    "hypothesis",
    "paho-mqtt>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 'ppc64le' or platform_machine == 'riscv64'",
    "psycopg>=3.1; platform_machine != 'x86_64' and platform_machine != 'AMD64' and platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'ppc64le' and platform_machine != 'riscv64'",
]
# The test suite plus lint, type-check and packaging tools (CI and development machines).
dev = ["spoolpi[test]", "ruff", "mypy", "pytest-cov", "twine"]

[project.scripts]
spoolpi = "spoolpi.cli:main"

[tool.hatch.version]
path = "src/spoolpi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spoolpi"]
exclude = ["**/.gitkeep"]

[tool.hatch.build.targets.sdist]
# The planning doc is internal (local paths, notes); caches and CI state aren't source.
exclude = [
    "/.ci",
    "/.githooks",
    "/.hypothesis",
    "/bench/*_run",
    "/uv.lock",
    "/spool_implementation-plan.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: crash-cycle tests that take a while to run",
]
