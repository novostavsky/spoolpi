[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spool"
version = "0.1.0.dev0"
description = "Crash-safe store-and-forward buffering for edge sensor data"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
http = ["httpx>=0.27"]
dev = ["pytest", "hypothesis", "ruff", "mypy", "pytest-cov", "paho-mqtt>=2.0", "httpx>=0.27"]

[project.scripts]
spool = "spool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spool"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: crash-cycle tests that take a while to run",
]
